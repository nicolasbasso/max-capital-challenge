# Puertos elegidos para no colisionar con otros stacks de la maquina.
# Nombres de contenedor y volumen propios del proyecto por la misma razon.
services:

  postgres:
    image: postgres:16-alpine
    container_name: maxcapital-postgres
    environment:
      POSTGRES_DB: orderstate
      POSTGRES_USER: orderstate
      POSTGRES_PASSWORD: orderstate
    ports:
      - "5433:5432"
    volumes:
      - maxcapital-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderstate -d orderstate"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Kafka en modo KRaft: un solo nodo, sin Zookeeper.
  # Un nodo implica factor de replicacion 1. Esta declarado en D-001: las garantias
  # demostradas cubren caidas del consumidor, no del broker.
  kafka:
    image: apache/kafka:3.8.0
    container_name: maxcapital-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "19092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 20

volumes:
  maxcapital-pgdata:
