# El cliente Docker que usa Testcontainers negocia por defecto la API 1.32, y los daemons de
# Docker recientes rechazan cualquier version anterior a la 1.40. Sin esto, Testcontainers
# reporta "Could not find a valid Docker environment" aunque Docker este corriendo.
#
# Se fija 1.44 porque la soporta cualquier Docker desde la version 23 en adelante, de modo que
# vale tanto en esta maquina como en CI.
api.version=1.44
