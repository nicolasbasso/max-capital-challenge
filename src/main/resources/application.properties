spring.application.name=order-state-service

# ---------------------------------------------------------------------------
# Persistencia
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/orderstate}
spring.datasource.username=${DB_USER:orderstate}
spring.datasource.password=${DB_PASSWORD:orderstate}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------------------------------------------------------------------------
# Kafka
# ---------------------------------------------------------------------------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:19092}
spring.kafka.consumer.group-id=order-state-service
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=MANUAL_IMMEDIATE

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# ---------------------------------------------------------------------------
# HTTP
# ---------------------------------------------------------------------------
server.port=${SERVER_PORT:8080}

# ---------------------------------------------------------------------------
# Aplicacion
# ---------------------------------------------------------------------------
app.instance-id=${APP_INSTANCE_ID:local}

app.kafka.execution-reports-topic=${ER_TOPIC:execution-reports}

# D-001: se mantiene fija durante el ejercicio. Cambiarla remapea claves y rompe la garantia
# de secuencia por orden.
app.kafka.partitions=${ER_PARTITIONS:4}

# D-001: el ejercicio corre un Kafka de un solo nodo, asi que el unico valor valido es 1. Una
# falla del broker implica perdida; las garantias demostradas cubren caidas del consumidor.
app.kafka.replicas=${ER_REPLICAS:1}

# D-006: los ER que rompen el contrato no se pueden asociar a una orden, asi que no entran en la
# tabla de cuarentena. Van aca para no perderlos.
app.kafka.dead-letter-topic=${ER_DLT:execution-reports-dlt}

# D-006: cantidad de reintentos ante fallas transitorias. Se cuenta en intentos y no en tiempo
# porque el tope por tiempo de ExponentialBackOff suma los intervalos de espera y no lo que tarda
# cada intento: con la base caida cada intento cuesta el connection-timeout de Hikari. Agotados los
# intentos el consumidor se frena en vez de mandar el stream a la dead-letter: la falla es del
# entorno, no del mensaje.
app.kafka.retry-max-attempts=${ER_RETRY_MAX_ATTEMPTS:3}

# D-006: la espera entre reintentos. Estan aca y no en el codigo porque el arranque valida que el peor
# caso de reintentos entre en un max.poll.interval.ms, y esa validacion necesita estos cuatro numeros.
app.kafka.retry-initial-interval=${ER_RETRY_INITIAL_INTERVAL:500ms}
app.kafka.retry-multiplier=${ER_RETRY_MULTIPLIER:2}
app.kafka.retry-max-interval=${ER_RETRY_MAX_INTERVAL:10s}

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging.pattern.console=%d{HH:mm:ss.SSS} [${app.instance-id:local}] [%thread] %-5level %logger{36} - %msg%n
