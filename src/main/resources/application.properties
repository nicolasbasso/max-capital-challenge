spring.application.name=order-state-service

# ---------------------------------------------------------------------------
# Persistencia
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/orderstate}
spring.datasource.username=${DB_USER:orderstate}
spring.datasource.password=${DB_PASSWORD:orderstate}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------------------------------------------------------------------------
# Kafka
# ---------------------------------------------------------------------------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:19092}
spring.kafka.consumer.group-id=order-state-service
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=MANUAL_IMMEDIATE

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# ---------------------------------------------------------------------------
# HTTP
# ---------------------------------------------------------------------------
server.port=${SERVER_PORT:8080}

# ---------------------------------------------------------------------------
# Aplicacion
# ---------------------------------------------------------------------------
app.instance-id=${APP_INSTANCE_ID:local}

app.kafka.topics.execution-reports=${ER_TOPIC:execution-reports}

# D-001: se mantiene fija durante el ejercicio. Cambiarla remapea claves y rompe la garantia
# de secuencia por orden.
app.kafka.partitions=${ER_PARTITIONS:4}

# D-001: el ejercicio corre un Kafka de un solo nodo, asi que el unico valor valido es 1. Una
# falla del broker implica perdida; las garantias demostradas cubren caidas del consumidor.
app.kafka.replicas=${ER_REPLICAS:1}

# D-006: los ER que rompen el contrato no se pueden asociar a una orden, asi que no entran en la
# tabla de cuarentena. Van aca para no perderlos.
app.kafka.topics.dead-letter=${ER_DLT:execution-reports-dlt}

# D-006: cantidad de reintentos ante fallas transitorias. Se cuenta en intentos y no en tiempo
# porque el tope por tiempo de ExponentialBackOff suma los intervalos de espera y no lo que tarda
# cada intento: con la base caida cada intento cuesta el connection-timeout de Hikari. Agotados los
# intentos el consumidor se frena en vez de mandar el stream a la dead-letter: la falla es del
# entorno, no del mensaje.
app.kafka.retry.max-attempts=${ER_RETRY_MAX_ATTEMPTS:3}

# D-006: la espera entre reintentos. Estan aca y no en el codigo porque el arranque valida que el peor
# caso de reintentos entre en un max.poll.interval.ms, y esa validacion necesita estos cuatro numeros.
app.kafka.retry.initial-interval=${ER_RETRY_INITIAL_INTERVAL:500ms}
app.kafka.retry.multiplier=${ER_RETRY_MULTIPLIER:2}
app.kafka.retry.max-interval=${ER_RETRY_MAX_INTERVAL:10s}

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging.pattern.console=%d{HH:mm:ss.SSS} [${app.instance-id:local}] [%thread] %-5level %logger{36} - %msg%n

# ---------------------------------------------------------------------------
# D-007: el settlement se publica desde un barrido, no desde la transaccion que aplica el ER.
# ---------------------------------------------------------------------------
app.settlement.topic=${SETTLEMENT_TOPIC:order-settlements}

# El intervalo es la latencia del settlement y ademas la ventana en la que un ER tardio puede
# suprimirlo: si la orden se ensucia antes de que el barrido pase, no se publica nada. O sea que
# el numero no es comodidad, cambia que ordenes settlean.
app.settlement.sweep.interval=${SETTLEMENT_SWEEP_INTERVAL:1s}

# Si la publicacion no responde, la transaccion falla y la fila queda sin marcar: la reintenta el
# barrido siguiente. El tope existe para no quedarse con la fila bloqueada esperando al broker.
app.settlement.publish-timeout=${SETTLEMENT_PUBLISH_TIMEOUT:5s}

# El publish-timeout acota la espera del ACK, pero send() puede bloquear ANTES de devolver el future
# mientras resuelve metadata del topic: eso lo acota max.block.ms, que por defecto es 60s. Sin este
# tope, un topic inexistente o un broker lento sostienen la fila bloqueada un minuto en vez de cinco
# segundos. El peor caso de una publicacion es la suma de los dos.
spring.kafka.producer.properties.max.block.ms=${SETTLEMENT_PUBLISH_MAX_BLOCK_MS:2000}

app.settlement.sweep.batch-size=${SETTLEMENT_BATCH_SIZE:100}
