spring.application.name=order-state-service

# ---------------------------------------------------------------------------
# Persistencia
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/orderstate}
spring.datasource.username=${DB_USER:orderstate}
spring.datasource.password=${DB_PASSWORD:orderstate}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------------------------------------------------------------------------
# Kafka
# ---------------------------------------------------------------------------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:19092}
spring.kafka.consumer.group-id=order-state-service
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=MANUAL_IMMEDIATE

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# ---------------------------------------------------------------------------
# HTTP
# ---------------------------------------------------------------------------
server.port=${SERVER_PORT:8080}

# ---------------------------------------------------------------------------
# Aplicacion
# ---------------------------------------------------------------------------
# Identifica la instancia en cada linea de log, para correlacionar que orden proceso cual.
app.instance-id=${APP_INSTANCE_ID:local}

app.kafka.execution-reports-topic=${ER_TOPIC:execution-reports}

# D-001: se mantiene fija durante el ejercicio. Cambiarla remapea claves y rompe la garantia
# de secuencia por orden.
app.kafka.partitions=${ER_PARTITIONS:4}

# D-001: el ejercicio corre un Kafka de un solo nodo, asi que el unico valor valido es 1. Una
# falla del broker implica perdida; las garantias demostradas cubren caidas del consumidor.
app.kafka.replicas=${ER_REPLICAS:1}

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging.pattern.console=%d{HH:mm:ss.SSS} [${app.instance-id:local}] [%thread] %-5level %logger{36} - %msg%n
